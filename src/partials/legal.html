<header class="section"><div class="padding"><div class="w-layout-vflex container"><div class="w-layout-blockcontainer container w-container"><div data-embed-src="__EMBED__" class="div"><div class="code-embed w-embed w-iframe w-script"><iframe id="embedded-frame" scrolling="no" style="width: 100%; border: 0; display: block; background: transparent; min-height: 400px"></iframe>

<script>
  (function () {
    var ALLOWED_ORIGIN = 'https://app.hamiltonrock.com'; // exact origin, no trailing slash
    var iframe = document.getElementById('embedded-frame');
    var script = document.currentScript;
    var wrapper = script.closest('[data-embed-src]');
    if (!wrapper) return;
    var url = wrapper.getAttribute('data-embed-src');
    if (iframe && url) iframe.src = url;

    window.addEventListener('message', function (e) {
      if (e.origin !== ALLOWED_ORIGIN) return;
      if (e.data && e.data.type === 'iframe-height' && typeof e.data.height === 'number') {
        iframe.style.height = e.data.height + 'px';
      }
    });
  })();
</script></div></div></div></div></div></header>
